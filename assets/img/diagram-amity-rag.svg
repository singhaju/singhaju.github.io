<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 638" role="img" aria-labelledby="amity-t amity-d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="amity-t">Amity Solutions: chatbots that answer from documents</title>
  <desc id="amity-d">A user's question is used to search a knowledge base of documents; the best matching documents and the question go to an LLM, which writes the answer back to the user. Separately, an LLM research paper is read, its idea is applied in the pipeline, and the result is tested end to end, from question to answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#e3eef6"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1aa38c"/>
      <stop offset="1" stop-color="#3b82e0"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 z" fill="#3b82e0"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 z" fill="#1aa38c"/>
    </marker>
  </defs>
  <rect width="800" height="638" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#g1)" opacity=".9"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#24324d">Amity Solutions: chatbots that answer from documents</text>

  <!-- Panel 1: RAG -->
  <rect x="20" y="52" width="760" height="394" rx="16" fill="#ffffff" fill-opacity=".45" stroke="#1aa38c" stroke-width="1.5"/>
  <text x="40" y="82" font-size="14" font-weight="700" fill="#14806d">1 · Answering a question (RAG)</text>

  <!-- knowledge base cylinder -->
  <path d="M350 106 V140 A50 10 0 0 0 450 140 V106 Z" fill="#e3f5f1" stroke="#1aa38c" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="400" cy="106" rx="50" ry="10" fill="#ffffff" stroke="#1aa38c" stroke-width="3"/>
  <text x="468" y="123" font-size="16" font-weight="600" fill="#24324d">Knowledge base<tspan x="468" dy="22">(documents)</tspan></text>

  <g fill="#ffffff" stroke-width="3">
    <rect x="40" y="190" width="200" height="84" rx="14" stroke="#1aa38c"/>
    <rect x="300" y="190" width="200" height="84" rx="14" stroke="#1aa38c" fill="#e3f5f1"/>
    <rect x="560" y="190" width="200" height="84" rx="14" stroke="#1aa38c"/>
    <rect x="560" y="312" width="200" height="84" rx="14" stroke="#1aa38c" fill="#e3f5f1"/>
    <rect x="300" y="312" width="200" height="84" rx="14" stroke="#1aa38c" stroke-dasharray="7 6"/>
  </g>
  <g stroke="#1aa38c" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M400 156 V182" marker-end="url(#at)"/>
    <path d="M246 232 H292" marker-end="url(#at)"/>
    <path d="M506 232 H552" marker-end="url(#at)"/>
    <path d="M660 280 V304" marker-end="url(#at)"/>
    <path d="M554 354 H508" marker-end="url(#at)"/>
  </g>
  <g font-size="16" font-weight="600" fill="#24324d" text-anchor="middle">
    <text x="140" y="226">User asks<tspan x="140" dy="22">a question</tspan></text>
    <text x="400" y="226">Search the<tspan x="400" dy="22">knowledge base</tspan></text>
    <text x="660" y="215">Best matching<tspan x="660" dy="22">documents + the</tspan><tspan x="660" dy="22">question</tspan></text>
    <text x="660" y="348">LLM writes<tspan x="660" dy="22">the answer</tspan></text>
    <text x="400" y="348">Answer back<tspan x="400" dy="22">to the user</tspan></text>
  </g>
  <text x="400" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#14806d">retrieval-augmented generation</text>

  <!-- Panel 2: papers to tests -->
  <g transform="translate(0 10)">
  <rect x="20" y="452" width="760" height="152" rx="16" fill="#ffffff" fill-opacity=".45" stroke="#3b82e0" stroke-width="1.5"/>
  <text x="40" y="482" font-size="14" font-weight="700" fill="#2563c4">2 · From papers to tests</text>
  <g fill="#ffffff" stroke-width="3">
    <rect x="40" y="500" width="200" height="84" rx="14" stroke="#3b82e0"/>
    <rect x="300" y="500" width="200" height="84" rx="14" stroke="#3b82e0" fill="#e4eefb"/>
    <rect x="560" y="500" width="200" height="84" rx="14" stroke="#3b82e0" stroke-dasharray="7 6"/>
  </g>
  <g stroke="#3b82e0" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M246 542 H292" marker-end="url(#ah)"/>
    <path d="M506 542 H552" marker-end="url(#ah)"/>
  </g>
  <g font-size="16" font-weight="600" fill="#24324d" text-anchor="middle">
    <text x="140" y="526">Read an LLM<tspan x="140" dy="22">research</tspan><tspan x="140" dy="22">paper</tspan></text>
    <text x="400" y="537">Apply the idea<tspan x="400" dy="22">in the pipeline</tspan></text>
    <text x="660" y="526">Test end to end,<tspan x="660" dy="22">from question</tspan><tspan x="660" dy="22">to answer</tspan></text>
  </g>
  </g>
</svg>
