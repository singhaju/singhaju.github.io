<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Two separate AI agents: a questionnaire agent answers due-diligence questionnaires from policy and evidence documents with evidence, a reason and a confidence score, plus gap analysis; a guidance agent walks a business owner through each step with checks and warnings" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#e3eef6"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1aa38c"/>
      <stop offset="1" stop-color="#3b82e0"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 z" fill="#3b82e0"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 z" fill="#1aa38c"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#g1)" opacity=".9"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#24324d">Third-party risk: two AI agents</text>

  <rect x="20" y="52" width="760" height="184" rx="16" fill="#ffffff" fill-opacity=".45" stroke="#1aa38c" stroke-width="1.5"/>
  <text x="40" y="82" font-size="14" font-weight="700" fill="#14806d">1 · Supplier side: answering a client's questionnaire</text>
  <g fill="#ffffff" stroke-width="3">
    <rect x="40" y="98" width="210" height="84" rx="14" stroke="#1aa38c"/>
    <rect x="290" y="98" width="170" height="84" rx="14" stroke="#1aa38c" fill="#e3f5f1"/>
    <rect x="500" y="98" width="260" height="84" rx="14" stroke="#1aa38c" stroke-dasharray="7 6"/>
  </g>
  <g stroke="#1aa38c" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M254 140 H282" marker-end="url(#at)"/><path d="M464 140 H492" marker-end="url(#at)"/></g>
  <g font-size="16" font-weight="600" fill="#24324d" text-anchor="middle">
    <text x="145" y="135">Policy and evidence<tspan x="145" dy="22">documents</tspan></text>
    <text x="375" y="135">Questionnaire<tspan x="375" dy="22">agent</tspan></text>
    <text x="630" y="124">Each answer:<tspan x="630" dy="22">evidence · reason ·</tspan><tspan x="630" dy="22">confidence score</tspan></text>
  </g>
  <text x="630" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#14806d">+ gap and fit-gap analysis</text>

  <rect x="20" y="252" width="760" height="160" rx="16" fill="#ffffff" fill-opacity=".45" stroke="#3b82e0" stroke-width="1.5"/>
  <text x="40" y="282" font-size="14" font-weight="700" fill="#2563c4">2 · Buyer side: taking on a new vendor</text>
  <g fill="#ffffff" stroke-width="3">
    <rect x="40" y="300" width="210" height="84" rx="14" stroke="#3b82e0"/>
    <rect x="290" y="300" width="170" height="84" rx="14" stroke="#3b82e0" fill="#e4eefb"/>
    <rect x="500" y="300" width="260" height="84" rx="14" stroke="#3b82e0" stroke-dasharray="7 6"/>
  </g>
  <g stroke="#3b82e0" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M254 342 H282" marker-end="url(#ah)"/><path d="M464 342 H492" marker-end="url(#ah)"/></g>
  <g font-size="16" font-weight="600" fill="#24324d" text-anchor="middle">
    <text x="145" y="348">Business owner</text>
    <text x="375" y="337">Guidance<tspan x="375" dy="22">agent</tspan></text>
    <text x="630" y="337">Step-by-step guidance ·<tspan x="630" dy="22">input checks · warnings</tspan></text>
  </g>
</svg>
